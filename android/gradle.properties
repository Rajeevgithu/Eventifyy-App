# --- JVM & AndroidX settings ---
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# --- Gradle user home folder ---
systemProp.gradle.user.home=E:/Development/Android/.gradle

# --- Force Gradle to use Java 17 ---
org.gradle.java.home=C:\\Program Files\\Eclipse Adoptium\\jdk-17.0.16.8-hotspot

# --- Performance optimizations ---
org.gradle.daemon=true
org.gradle.caching=true
org.gradle.parallel=true

# --- Optional: Reduce Gradle startup noise ---
org.gradle.logging.level=quiet
