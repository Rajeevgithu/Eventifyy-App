steps:
  # 1. Checkout repository code
  - uses: actions/checkout@v4

  # 2. Setup Flutter Environment (Moved inside 'steps' and properly indented)
  - name: Set up Flutter SDK
    uses: subosito/flutter-action@v2
    with:
      channel: 'stable'

  # 3. Get Flutter dependencies (NEW CRITICAL STEP)
  - name: Get Dependencies
    run: flutter pub get

  # 4. Build the web app (This step will no:w succeed)
  - name: Build Web
    run: flutter build web

  # 5. Deploy to Firebase Hosting Preview Channel
  - uses: FirebaseExtended/action-hosting-deploy@v0
    with:
      repoToken: ${{ secrets.GITHUB_TOKEN }}
      firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EVENT_BOOKING_APP_1FA34 }}
      projectId: event-booking-app-1fa34
