# 1. ADDED: Setup Flutter Environment
  - uses: subosito/flutter-action@v2
    with:
      channel: 'stable' # Use the stable channel
      
  # 2. ADDED: Get Flutter dependencies
  - run: flutter pub get
      
  # 3. Build the web app (Now the 'flutter' command will work)
  - run: flutter build web
      
  # 4. Deploy to Firebase Hosting
  - uses: FirebaseExtended/action-hosting-deploy@v0
    with:
      repoToken: ${{ secrets.GITHUB_TOKEN }}
      firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EVENT_BOOKING_APP_1FA34 }}
      channelId: live
      projectId: event-booking-app-1fa34